<h2>Natija kiritish — Shartnoma #{{ shartnoma.id }}</h2>

<p><strong>Buyurtmachi:</strong> {{ shartnoma.buyurtmachi }}</p>
<p><strong>Jami summa:</strong> {{ shartnoma.jami_summa }}</p>

<hr>

<form method="post">
    {% csrf_token %}

    <table border="1" cellpadding="5">
        <tr>
            <th>Ko‘rsatkich</th>
            <th>Meyor</th>
            <th>Natija</th>
        </tr>

        {% for item in itemlar %}
        <tr>
            <td>{{ item.narxnoma.korsatkich_nomi }}</td>
            <td>
                <input type="text"
                    name="meyor_{{ item.narxnoma.id }}"
                    required>
            </td>
            <td>
                <input type="number"
                    step="0.01"
                    name="narx_{{ item.narxnoma.id }}"
                    required>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <button type="submit">Saqlash</button>
</form>
