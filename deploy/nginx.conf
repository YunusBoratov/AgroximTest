server {
    listen 80;
    server_name agroximtest.uz www.agroximtest.uz;
    client_max_body_size 80M;

    location /static/ { alias /srv/agroximtest/staticfiles/; expires 7d; }

    location / {
        proxy_pass http://unix:/run/agroximtest/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
